name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: flake8 src/ tests/ --max-line-length=88

      - name: Run tests with coverage
        run: pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=80

  security:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Scan for vulnerabilities
        run: pip-audit -r requirements.txt

  deploy:
    runs-on: ubuntu-latest
    needs: [test, security]          # only deploy if BOTH jobs pass
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'  # only deploy from main branch

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          echo "All checks passed. Deploying to production..."
          echo "In a real project this would be:"
          echo "  - docker build + push"
          echo "  - kubectl apply"
          echo "  - ssh into server and restart service"
          echo "  - trigger AWS/GCP/Azure deployment"
          echo "Deploy complete!"
